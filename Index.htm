<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Love You, Friend ❤️</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    width: 100%;
    height: 100vh;
    overflow: hidden;

    display: flex;
    justify-content: center;
    align-items: center;

    background: linear-gradient(135deg, #ff758c, #ff7eb3);
    font-family: Arial, sans-serif;
}

/* Main message */
.love-title {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;

    padding: 20px;
    position: relative;
    z-index: 10;

    animation: pop 1s ease;
}

.love-title h1 {
    margin: 0;
    color: white;
    font-size: clamp(32px, 8vw, 60px);
    white-space: nowrap;

    text-shadow:
        0 0 10px rgba(255,255,255,0.7),
        0 0 25px rgba(255,255,255,0.5);
}

.love-title span {
    font-size: clamp(35px, 9vw, 65px);

    animation: pulse 1.5s infinite ease-in-out;

    filter:
        drop-shadow(0 0 8px rgba(255,255,255,0.8));
}

/* Floating hearts */
.heart {
    position: absolute;
    bottom: -60px;

    color: #ff3b4f;
    font-size: 28px;

    pointer-events: none;

    animation: float linear forwards;

    filter:
        drop-shadow(0 0 5px rgba(255,255,255,0.5));
}

/* Message animation */
@keyframes pop {
    0% {
        transform: scale(0);
        opacity: 0;
    }

    70% {
        transform: scale(1.08);
    }

    100% {
        transform: scale(1);
        opacity: 1;
    }
}

/* Heart pulse */
@keyframes pulse {
    0%, 100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.18);
    }
}

/* Floating animation */
@keyframes float {
    0% {
        transform:
            translateY(0)
            rotate(0deg);

        opacity: 0;
    }

    10% {
        opacity: 0.8;
    }

    100% {
        transform:
            translateY(-115vh)
            rotate(360deg);

        opacity: 0;
    }
}
</style>
</head>

<body>

<div class="love-title">
    <span>❤️</span>
    <h1>Love You, Friend!</h1>
    <span>❤️</span>
</div>

<script>

function createHeart() {

    const heart = document.createElement("div");

    heart.className = "heart";

    heart.innerHTML = "❤️";

    heart.style.left =
        Math.random() * 100 + "vw";

    heart.style.fontSize =
        (18 + Math.random() * 25) + "px";

    heart.style.animationDuration =
        (4 + Math.random() * 4) + "s";

    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 8000);
}

/* Create floating hearts */
setInterval(createHeart, 450);

</script>

</body>
</html>
